name: Release CI

permissions:
  contents: read
  packages: read
  actions: read

on:
  release:
    types: [published]
  # allow manually triggering the build
  workflow_dispatch:

jobs:
  build_python_packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # use the minimum py ver we support to generate the wheel
          python-version-file: ".python-version"

      - name: Build python package
        run: |
          uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-python-packages
          path: dist/*

  build_and_release_ota_image_tools:
    runs-on: ubuntu-latest
    container:
      # glibc compatible with ubuntu:20.04 and newer
      image: debian:bullseye

    steps:
      - name: Install system dependencies
        run: |
          # bullseye is archived: deb.debian.org no longer serves its packages
          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main' \
            'deb http://archive.debian.org/debian-security bullseye-security main' \
            > /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates binutils

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version_ota_image_tools"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.11"

      - name: Build binary with PyInstaller
        run: |
          uv run --locked pyinstaller \
            --onefile -s \
            --name ota-image-tools \
            --clean \
            src/ota_image_tools/__main__.py

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-ota-image-tools
          path: dist/*

  post_build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' }}
    needs: [build_python_packages, build_and_release_ota_image_tools]
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download python packages artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: artifacts-python-packages
          path: dist

      - name: Download ota-image-tools binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: artifacts-ota-image-tools
          path: dist

      - name: Calculate artifacts' checksum
        uses: ./.github/actions/calculate_checksum
        with:
          file_patterns: '*'
          directory: 'dist'

      - name: Publish release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*
